name: Deploy Operation Fog City

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch location photos from Wikimedia Commons
        run: |
          pip install --quiet pillow
          python3 scripts/fetch_photos.py

      - name: Commit new photos back to the repo
        run: |
          if [ -n "$(git status --porcelain site/photos)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add site/photos
            git commit -m "Add location photos [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
